name: CI

# Verification only — deliberately NO deploy step. Railway's own git-triggered
# deploy is unchanged by this workflow; this exists purely to catch breakage
# before it reaches main.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    name: Install, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Twelve test files build real video with ffmpeg rather than asserting over fixtures —
      # `writeTestVideo` and its siblings — so without it the suite fails with
      # `spawnSync ffmpeg ENOENT` and says nothing about the code. The runner image does not
      # carry it; the Dockerfile installs it in both stages and verifies it with `ffmpeg -version`,
      # and this is the same dependency for the same reason.
      #
      # It went unnoticed because CI never reached the tests: `pnpm install --frozen-lockfile`
      # failed first, on a lockfile that had drifted from package.json, and every step after it was
      # skipped. Fixing the install is what made this visible.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # RONDE 151: before anything else, because this is the failure that reached production.
      # A .sql file with no journal entry is invisible to drizzle: the deploy reports
      # "nothing to apply", starts, and crash-loops at schema validation. It is fully detectable
      # from two files on disk, so it is caught here rather than in production.
      - name: Migration artifact integrity
        run: pnpm run migrations:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fastvid:ci-check
